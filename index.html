<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عقدي - خزنة العقود والمهام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;--warn:#fef3c7;--warnt:#92400e;--err:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2d3339;--ac:#2dd4bf;--ac2:#06231f;--warn:#3a2e0b;--warnt:#fcd34d;--err:#f97066}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2d3339;--ac:#2dd4bf;--ac2:#06231f;--warn:#3a2e0b;--warnt:#fcd34d;--err:#f97066}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.7;min-height:100%}
main{max-width:820px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.mut,.sub,.tag{color:var(--mut)}.tag{font-size:.85rem}
.err{color:var(--err)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}
textarea{min-height:140px;resize:vertical}
select{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bar h1{flex:1}
.burger{font-size:1.3rem;padding:6px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--ac)}
.item{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.item b{display:block}
img.pic{max-width:100%;border-radius:10px;border:1px solid var(--bd);margin:8px 0}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:10px;border-radius:10px;margin:8px 0}
.warn{background:var(--warn);color:var(--warnt);padding:10px;border-radius:10px;margin-top:8px}
.done{text-decoration:line-through;color:var(--mut)}
.bell{position:relative}.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--err);color:#fff;border-radius:9px;font-size:.7rem;padding:0 5px;line-height:1.4}
.hide{display:none!important}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;inset-inline-start:0;width:clamp(260px,25vw,340px);max-width:85vw;background:var(--card);border-inline-end:1px solid var(--bd);transform:translateX(100%);transition:transform .25s;z-index:21;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;display:flex;flex-direction:column;gap:6px}
#dr.on{transform:translateX(0)}
[dir=ltr] #dr{transform:translateX(-100%)}[dir=ltr] #dr.on{transform:none}
#dr .nm{padding:6px 6px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px}
#dr button{text-align:start;border:0;background:transparent;padding:11px 10px}
#dr button:hover{background:var(--bg)}
#dr hr{border:0;border-top:1px solid var(--bd);width:100%;margin:4px 0}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#mo .card{width:100%;max-width:380px;margin:0}
#aqdi-debug{position:fixed;left:8px;right:8px;bottom:8px;max-height:40vh;overflow:auto;background:rgba(0,0,0,0.8);color:#fff;padding:10px;border-radius:8px;font-family:monospace;z-index:9999;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<div id="auth" class="card hide" style="max-width:420px;margin:8vh auto 0">
  <button id="lg" data-notr style="float:inline-end">🌐 English</button>
  <h1 id="at">عقدي 📁</h1>
  <p class="sub" id="as"></p>
  <input id="fn" placeholder="الاسم الكامل">
  <input id="pw" type="password" placeholder="كلمة السر">
  <input id="pw2" type="password" placeholder="أعد كتابة كلمة السر">
  <button class="p" id="go">دخول</button>
  <p class="err" id="am"></p>
</div>

<div id="app" class="hide">
  <div class="bar"><button class="burger" id="bg" aria-label="القائمة">☰</button><h1 id="ttl">الرئيسية</h1><button class="burger bell" id="bl" aria-label="التنبيهات">🔔<span class="badge hide" id="bd">0</span></button></div>

  <section id="v-home">
    <p>أهلًا <b id="who"></b> 👋</p>
    <div id="h-al"></div>
    <div class="stats">
      <div class="stat"><b id="s1">0</b><span class="tag">عقود</span></div>
      <div class="stat"><b id="s2">0</b><span class="tag">مهام مفتوحة</span></div>
      <div class="stat"><b id="s3">0</b><span class="tag">متأخرة</span></div>
    </div>
    <div class="row" style="margin-bottom:14px"><button class="p" id="q1">+ عقد جديد</button><button class="p" id="q2">+ مهمة جديدة</button></div>
    <div class="card"><h2>مهام قريبة</h2><div id="h-tasks"></div></div>
    <div class="card"><h2>آخر العقود</h2><div id="h-con"></div></div>
  </section>

  <section id="v-files" class="hide">
    <div class="card">
      <h2>إضافة عقد</h2>
      <input id="cn" placeholder="اسم العقد (مثال: عقد إيجار المكتب)">
      <label class="mut">تاريخ العقد</label><input id="cd" type="date">
      <label class="mut">تاريخ انتهاء العقد (اتركه فارغًا ليحاول الذكاء الاصطناعي استخراجه من النص)</label><input id="ce" type="date">
      <label class="mut">نبّهني قبل الانتهاء بـ (أيام)</label><input id="cr" type="number" min="1" value="30">
      <label class="mut">نوع العقد</label><select id="ck"><option value="إيجار">إيجار</option><option value="توريد">توريد</option><option value="خدمات">خدمات</option><option value="عمل">عمل</option><option value="أخرى">أخرى</option></select>
      <textarea id="ct" placeholder="اكتب أو الصق نص العقد هنا (اختياري)"></textarea>
      <div class="row" style="margin-bottom:8px"><button id="pst">📋 لصق من الحافظة</button><button id="smp">🧪 عقد تجريبي</button><button id="cls">مسح النص</button></div>
      <label class="mut">أو ارفع صورة أو ملف PDF:</label>
      <input id="cf" type="file" accept="image/*,application/pdf">
      <div class="row"><button class="p" id="save">حفظ العقد</button><span class="mut" id="smsg"></span></div>
    </div>
    <input id="q" placeholder="🔍 ابحث باسم العقد أو التاريخ">
    <select id="qk"><option value="">كل الأنواع</option><option value="إيجار">إيجار</option><option value="توريد">توريد</option><option value="خدمات">خدمات</option><option value="عمل">عمل</option><option value="أخرى">أخرى</option></select>
    <div id="list"></div>
  </section>

  <section id="v-tasks" class="hide">
    <div class="card">
      <h2>مهمة جديدة</h2>
      <input id="tt" placeholder="المهمة">
      <input id="td" type="date">
      <button class="p" id="addt">إضافة</button>
    </div>
    <div id="tasks"></div>
  </section>
</div>
</main>

<div id="ov"></div>
<aside id="dr"></aside>

<script>
// Debug overlay: captures uncaught errors and promise rejections and displays them at the bottom of the page
(function(){
  try{
    const d = document.createElement('pre'); d.id = 'aqdi-debug'; d.style.display = 'none'; document.body.appendChild(d);
    function show(msg){ d.style.display = 'block'; d.textContent += '['+new Date().toISOString()+'] ' + msg + '\n'; }
    window.addEventListener('error', function(e){ try{ show('Error: ' + (e && (e.message || e.error || e.filename) ) ); }catch(_){} });
    window.addEventListener('unhandledrejection', function(e){ try{ show('UnhandledRejection: ' + (e && e.reason && (e.reason.message || e.reason) || e.reason) ); }catch(_){} });
    // also expose a quick logger
    window.AQDI_DEBUG = {show};
    // small ping so we know the script ran
    show('debug overlay initialized');
  }catch(e){ console.error('debug init failed', e); }
})();

const $ = id => document.getElementById(id);
// If the page runs outside claude.ai, provide a small stub so calls don't produce "claude is not defined" errors
if(typeof claude === 'undefined'){
  window.claude = {
    use: async () => { throw { code: 'not_granted' }; }
  };
}
let db, uid, base, P = null, contracts = [], tasks = [], unsub = null, fails = 0, locked = 0;

function el(tag, txt, cls){ const e = document.createElement(tag); if(txt != null) e.textContent = txt; if(cls) e.className = cls; return e; }
const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, "0")).join("");
async function H(p, salt){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + p)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join(""); }
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- Local DB fallback (localStorage) ---------- */
function makeLocalDB(){
  const KEY = 'aqdi_store_v1';
  let store = {};
  try{ store = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ store = {}; }
  const subs = {};
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
    // notify subscribers
    Object.keys(subs).forEach(prefix => {
      const docs = Object.keys(store).filter(p => p === prefix || p.startsWith(prefix + '/')).map(p => ({id: p.split('/').slice(-1)[0], data: () => store[p]}));
      subs[prefix].forEach(cb => cb({docs}));
    });
  }
  return {
    doc(path){
      return {
        get: async () => ({ exists: !!store[path], data: () => store[path] }),
        set: async (v) => { store[path] = v; persist(); },
        update: async (v) => { store[path] = Object.assign({}, store[path] || {}, v); persist(); },
        delete: async () => { delete store[path]; persist(); }
      };
    },
    collection(prefix){
      return {
        onSnapshot: (cb, err) => {
          subs[prefix] = subs[prefix] || [];
          subs[prefix].push(cb);
          // initial call
          const docs = Object.keys(store).filter(p => p === prefix || p.startsWith(prefix + '/')).map(p => ({id: p.split('/').slice(-1)[0], data: () => store[p]}));
          setTimeout(() => cb({docs}), 0);
          return () => { subs[prefix] = subs[prefix].filter(x => x !== cb); };
        }
      };
    }
  };
}

/* ---------- boot & auth ---------- */
async function boot(){
  // If claude is present use remote DB, otherwise use local fallback
  if(window.claude && typeof window.claude.use === 'function'){
    try{ const user = await claude.use("user"); db = await claude.use("db"); uid = user && await user.id(); }catch(e){}
    if(!db || !uid){ showAuth("err", "التخزين غير متاح. افتح الصفحة من حسابك في claude.ai."); return; }
    base = "data/users/" + uid;
    try{ const s = await db.doc(base + "/profile").get(); P = s.exists ? s.data() : null; }catch(e){}
    try{ const t = await db.doc(base + "/tasks").get(); tasks = (t.exists && t.data().items) || []; }catch(e){}
    if(!unsub) unsub = db.collection(base).onSnapshot(s => {
      contracts = s.docs.filter(d => d.id.startsWith("c") && d.data() && d.data().name).map(d => ({id:d.id, ...d.data()}));
      renderList(); renderHome();
    }, e => {});
    try{ const t = localStorage.getItem("aqdi-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
    showAuth();
    return;
  }

  // Local fallback (no claude)
  db = makeLocalDB();
  uid = localStorage.getItem('aqdi_uid');
  if(!uid){ uid = 'local-' + rnd(); localStorage.setItem('aqdi_uid', uid); }
  base = "data/users/" + uid;
  try{ const s = await db.doc(base + "/profile").get(); P = s.exists ? s.data() : null; }catch(e){}
  try{ const t = await db.doc(base + "/tasks").get(); tasks = (t.exists && t.data().items) || []; }catch(e){}
  if(!unsub) unsub = db.collection(base).onSnapshot(s => {
    contracts = s.docs.filter(d => d.id.startsWith("c") && d.data() && d.data().name).map(d => ({id:d.id, ...d.data()}));
    renderList(); renderHome();
  }, e => {});
  try{ const t = localStorage.getItem("aqdi-theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
  showAuth();
}

function showAuth(mode, msg){
  $("app").classList.add("hide"); $("auth").classList.remove("hide"); $("am").textContent = msg || "";
  const setup = !P || !P.hash;
  $("fn").classList.toggle("hide", !setup); $("pw2").classList.toggle("hide", !setup);
  $("pw").value = ""; $("pw2").value = ""; $("go").disabled = mode == "err";
  if(setup){ $("at").textContent = "مرحبًا بك في عقدي 📁"; $("as").textContent = "أنشئ حسابك: اسمك الكامل وكلمة سر تدخل بها كل مرة."; $("fn").value = (P && P.name) || ""; $("go").textContent = "إنشاء الحساب"; }
  else { $("at").textContent = "أهلًا " + P.name; $("as").textContent = "اكتب كلمة السر للدخول."; $("go").textContent = "دخول"; }
}

// ... rest of the original script unchanged ...

if(window.claude) boot(); else boot();
</script>
</body>
</html>
